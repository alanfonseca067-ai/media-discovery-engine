name: MDE 0.3.0 tests

on:
  push:
    branches: [mde-0.3.0]
    paths:
      - "mde-v0.3.0/**"
      - ".github/workflows/mde-030.yml"
  pull_request:
    branches: [mde-0.3.0]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: mde-v0.3.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
