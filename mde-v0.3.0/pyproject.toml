[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "media-discovery-engine"
version = "0.3.0"
description = "Independent media catalog and authorized delivery engine"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "httpx>=0.27,<1", "pydantic>=2.6,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mde_v030*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
